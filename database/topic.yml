"Atmospheric Aerosols":
  "Dust Aerosols": '(ti:dust OR abs:dust OR ti:mineral OR abs:mineral) AND (ti:aerosol OR abs:aerosol)'

  "Aerosol Optical Properties": '(ti:aerosol OR abs:aerosol) AND (ti:extinction OR abs:extinction OR ti:backscatter OR abs:backscatter OR ti:scattering OR abs:scattering)'


"Lidar Remote Sensing":
  "Aerosol Lidar Retrieval": '(ti:lidar OR abs:lidar) AND (ti:aerosol OR abs:aerosol) AND (ti:retrieval OR abs:retrieval OR ti:inversion OR abs:inversion)'

  "Dust and Aerosol Depolarization": '(ti:lidar OR abs:lidar) AND (ti:depolarization OR abs:depolarization OR ti:depolarisation OR abs:depolarisation) AND (ti:dust OR abs:dust OR ti:aerosol OR abs:aerosol)'

  "Lidar Extinction and Backscatter": '(ti:lidar OR abs:lidar) AND (ti:extinction OR abs:extinction OR ti:backscatter OR abs:backscatter)'


"Atmospheric AI":
  "Machine Learning for Aerosol Retrieval": '(ti:aerosol OR abs:aerosol) AND (ti:retrieval OR abs:retrieval OR ti:inversion OR abs:inversion) AND (ti:learning OR abs:learning OR ti:neural OR abs:neural)'

  "Satellite Aerosol Retrieval": '(ti:satellite OR abs:satellite OR ti:remote OR abs:remote) AND (ti:aerosol OR abs:aerosol) AND (ti:retrieval OR abs:retrieval)'

  "General Neural Operator Methods": '(ti:"neural operator" OR abs:"neural operator" OR ti:"Fourier neural operator" OR abs:"Fourier neural operator" OR ti:PINO OR abs:PINO)'

  "Neural Operators for Atmosphere": '(ti:"neural operator" OR abs:"neural operator" OR ti:"Fourier neural operator" OR abs:"Fourier neural operator" OR ti:PINO OR abs:PINO) AND (ti:atmosphere OR abs:atmosphere OR ti:atmospheric OR abs:atmospheric OR ti:weather OR abs:weather OR ti:climate OR abs:climate OR ti:aerosol OR abs:aerosol OR ti:"remote sensing" OR abs:"remote sensing")'
  
  "Neural Operators for Aerosol and Lidar": '(ti:"neural operator" OR abs:"neural operator" OR ti:"Fourier neural operator" OR abs:"Fourier neural operator" OR ti:PINO OR abs:PINO) AND (ti:aerosol OR abs:aerosol OR ti:lidar OR abs:lidar OR ti:dust OR abs:dust OR ti:retrieval OR abs:retrieval OR ti:inversion OR abs:inversion)'
