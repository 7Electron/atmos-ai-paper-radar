name: Run Arxiv Papers Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "17 09 * * *"
      timezone: "Asia/Shanghai"
  push:
    branches: [main]

concurrency:
  group: arxiv-daily-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: "Asia/Shanghai"
      PYTHONUTF8: "1"
      RUN_ENV: "production"
      POWER: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run daily arxiv
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python main.py run --env="${{ env.RUN_ENV }}" --power="${{ env.POWER }}"; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 300))
              echo "arXiv request failed; retrying in ${delay}s (attempt $((attempt + 1))/3)"
              sleep "$delay"
            fi
          done

          echo "arXiv request failed after 3 attempts."
          exit 1

      - name: Commit generated papers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md database/storage
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Automated update @ $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin HEAD:main

      - name: Deploy docs
        run: mkdocs gh-deploy --force
